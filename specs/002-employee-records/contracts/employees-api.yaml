openapi: 3.0.3
info:
  title: ACME Employee API
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /api/employees:
    get:
      summary: Search employees
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: department, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: sort, in: query, schema: { type: string, example: lastName,asc } }
      responses:
        '200': { description: Paged employee results }
        '401': { description: Authentication required }
    post:
      summary: Create employee
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EmployeeCreateInput' } }
      responses:
        '201': { description: Created }
        '400': { description: Validation failed }
        '403': { description: Insufficient role }
        '409': { description: Email already exists }
  /api/employees/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Get employee
      responses:
        '200': { description: Employee record }
        '404': { description: Not found }
    put:
      summary: Update employee
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/EmployeeCreateInput' } }
      responses:
        '200': { description: Updated }
        '400': { description: Validation failed }
        '403': { description: Insufficient role }
        '404': { description: Not found }
        '409': { description: Email already exists }
    delete:
      summary: Delete employee as an administrator
      responses:
        '204': { description: Deleted }
        '403': { description: Administrator role required }
        '404': { description: Not found }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    EmployeeCreateInput:
      type: object
      required: [firstName, lastName, email, department, jobTitle, country, currency, baseSalary, bonus, effectiveDate, active]
      properties:
        firstName: { type: string, maxLength: 80 }
        lastName: { type: string, maxLength: 80 }
        email: { type: string, format: email, maxLength: 160 }
        department: { type: string, maxLength: 100 }
        jobTitle: { type: string, maxLength: 120 }
        country: { type: string, maxLength: 80 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        baseSalary: { type: number, minimum: 0, multipleOf: 0.01 }
        bonus: { type: number, minimum: 0, multipleOf: 0.01 }
        effectiveDate: { type: string, format: date }
        active: { type: boolean }
