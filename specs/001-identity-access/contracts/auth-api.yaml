openapi: 3.0.3
info:
  title: ACME Identity API
  version: 1.0.0
paths:
  /api/auth/login:
    post:
      summary: Authenticate a staff user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request shape
        '401':
          description: Invalid credentials
components:
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, HR_MANAGER, VIEWER]