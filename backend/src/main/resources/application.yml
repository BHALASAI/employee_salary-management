server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: jdbc:sqlite:${DB_PATH:data/salary.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  jackson:
    default-property-inclusion: non_null

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}

security:
  jwt-secret: ${JWT_SECRET:acme-demo-secret-change-this-before-production-2026}
  jwt-expiration-ms: ${JWT_EXPIRATION_MS:7200000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
